name: Build SKSE Plugin

# Manual runs plus pull requests and version tags. Day-to-day iteration is faster locally.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

env:
  MOD_NAME: er-equipload

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true
          package-cache: true
          # CommonLib dominates build time and only changes with the submodule, so key the build
          # cache on the build files and submodule commits rather than on every source change.
          build-cache-key: windows-ci-${{ hashFiles('xmake.lua', 'xmake-rules.lua') }}-${{ hashFiles('lib/commonlibsse/src/**', 'lib/commonlibsse/include/**') }}
          package-cache-key: windows-ci-${{ hashFiles('xmake.lua', 'xmake-requires.lock', 'lib/commonlibsse/xmake.lua') }}

      - name: Configure
        run: xmake f -m releasedbg -y

      - name: Build plugin
        run: xmake build -y

      - name: Unit tests
        run: |
          xmake build -y er-equipload-tests
          xmake run er-equipload-tests

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.MOD_NAME }}
          path: Distr
